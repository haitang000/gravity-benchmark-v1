models:
  - name: local-gguf
    backend: llama_cpp
    model_ref: C:/models/model.gguf
    config:
      n_ctx: 4096
      n_gpu_layers: 999
      n_batch: 512
  - name: api-model
    backend: openai_compatible
    model_ref: model-name
    config:
      base_url: http://127.0.0.1:8000/v1
      api_key_env: OPENAI_API_KEY
suite: quick
languages: [zh, en]
