[project]
name = "gravity-bench"
version = "0.1.0"
description = "Offline-first benchmark platform for 2B-14B language models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "sqlmodel>=0.0.22,<1",
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
  "jsonschema>=4.23,<5",
  "psutil>=6",
]

[project.optional-dependencies]
local = ["transformers>=4.45,<5", "torch>=2.4", "llama-cpp-python>=0.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.22"]

[tool.setuptools.packages.find]
include = ["backend*"]

[project.scripts]
gravity-bench = "backend.main:run"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
